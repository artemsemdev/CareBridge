services:
  carebridge-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carebridge-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - carebridge-sqldata:/var/opt/mssql
    networks:
      - carebridge-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  carebridge-rabbitmq:
    image: rabbitmq:3-management
    container_name: carebridge-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - carebridge-rabbitmqdata:/var/lib/rabbitmq
    networks:
      - carebridge-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  carebridge-azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: carebridge-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - carebridge-azuritedata:/data
    networks:
      - carebridge-network

volumes:
  carebridge-sqldata:
  carebridge-rabbitmqdata:
  carebridge-azuritedata:

networks:
  carebridge-network:
    driver: bridge
